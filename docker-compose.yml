services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: arcaos
      POSTGRES_PASSWORD: arcaos
      POSTGRES_DB: arcaos_dev
    ports:
      - "5432:5432"
    volumes:
      - arcaos_db_data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arcaos -d arcaos_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Roda a imagem de produção (Dockerfile) — útil pra conferir o build
  # containerizado antes de subir em outro lugar que não a Vercel. Para o
  # dia a dia de desenvolvimento (hot reload), continue usando `npm run dev`
  # com só o serviço `db` de pé: `docker compose up -d db`.
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.local
    environment:
      DATABASE_URL: postgresql://arcaos:arcaos@db:5432/arcaos_dev
    ports:
      - "3000:3000"

volumes:
  arcaos_db_data:
